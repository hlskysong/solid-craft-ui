name: CI

# T1-07：门禁链全部收敛到 pnpm verify，CI 只负责装依赖、验平台包、跑这一条命令。
# D-09 已定：GitHub Actions + 公开 npmjs.org；D-01 正式名已定，仓库地址与 npm 账号
# 均已登记（D-10 ①②，见 scripts/scope.mjs），Aming 已于 2026-11-09 完成首次推送。
# D-10 已齐、T1-11 受控发布通道另落在 release.yml；本 verify workflow 不参与发布，
# 不含任何凭据或发布步骤。
# 仓库地址由 scope.mjs 单点定义、check:release 校验 4 个 package.json 同源；
# 入库内容安全由 check:public 守着（pnpm verify 已接入），checkout 由 Actions 自动完成。
# 发布闸门由 scripts/check-release.mjs 守着，发布走 release.yml 的暂存通道
# （手动触发 + environment 审批 + 维护者 2FA 批准后才上线）。
# 切换 CI 平台只需替换本文件，scripts/check-ci.mjs 的契约校验与 pnpm verify 不变。
#
# 用量红线（2026-11-11 §30.17，Aming 提出）：一次 push 只允许跑 1 个 job。
# 公开仓库不按分钟计费，但短时间内大量 workflow run / job 会触发用量告警甚至封号；
# 本仓单维护者、每次提交前都在本机跑完整 pnpm verify，CI 只当第二意见，不必每条链都上 CI。
#   - verify：macOS 主门禁，push dev（增量）/ push main、tag、手动、夜间（全量）；
#   - platform-packages：三架构跨平台矩阵，只在 workflow_dispatch 跑（出包前 / 定期人工校验），
#     macOS 架构已由 verify 覆盖，故不随每次 push 付三个 runner；
#   - 不接 pull_request：本仓无 PR 流程，日常直推 dev、发版才合并 main，接上等于每个 PR 再跑一整套；
#   - concurrency + cancel-in-progress：连续 push 时取消上一轮，不留并发堆积；
#   - 每个 job 设 timeout-minutes：卡死的 runner 不会烧到默认 6 小时。
#
# 分支策略（2026-11-13 §30.34，Aming 定：「另开 dev 作为开发分支，后续只有发版才合并到 main」）：
#   - dev  = 日常开发分支，每次 push 走增量门禁；main = 发版分支，push 一律走全量。
#   - 于是「发版全量」不再靠 tag 单独保证：合并 dev → main 本身就是一次全量 26 阶段复验。
#   - 两个门严格互补：只有 `push && refs/heads/dev` 走增量，其余所有事件走全量（含 tag、
#     workflow_dispatch、schedule、push main），不存在「两个门都不跑」的静默空窗。
#
# 增量门禁（2026-11-12 §30.33）：
#   - verify 的 26 阶段里只有 e2e 吃时间（CI 实测 350s / 433s = 81%），其中 browser 159s
#     + visual 142s 是「组件 × Demo」逐页跑；只改一个组件却重跑 106 张截图是纯浪费。
#   - dev 的 push → scripts/affected.mjs 从 git diff 推断作用域 → pnpm verify:main。
#   - 判定原则「默认全量、白名单才收缩」：共享面（styles / primitives / tokens / 宿主 /
#     tests / scripts / lock / workflow）与任何未识别路径一律 all，宁可多跑不能漏跑。
#   - 故意保持同一个 job 内分流（不新增 job）：用量红线仍是「每次 push 1 个 job」。
#   - 过渡期边界：push 事件的 workflow 定义取自被推送分支，schedule / workflow_dispatch
#     只读默认分支（main）的文件；dev 合并到 main 之前，夜跑与手动派发仍按 main 上的旧版
#     执行（旧版本身就是全量，不会退化）。合并一次后两分支完全一致。
#
# 判据机器化：scripts/check-ci.mjs 第 4 条按「每次 push 运行的 job 数 ≤ 1」计数，
# 新增 job 不显式 gate 就红灯 —— 省用量这件事靠脚本，不靠记性。

on:
  push:
    # dev = 日常开发（增量），main = 发版合并（全量）。两条都监听是刻意的：
    # 漏掉 main 会让「只有发版才合并 main」这一动作完全不受门禁约束。
    branches: [dev, main]
    # 打 tag 走全量（§30.33）：发布前必须有一次完整 26 阶段，不看 diff
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # 夜间全量兜底：dev 日常走增量，视觉 / axe 的长期漂移最迟次日早上被抓到
    # （UTC 00:30 = 北京 08:30）；schedule 只用默认分支的 workflow 定义。
    - cron: '30 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gate (pnpm verify / verify:main)
    # 16 张截图基线在 macOS + Playwright bundled chromium（版本由 lockfile 锁定）下生成，
    # 主门禁跑同一 runner 平台（macOS 字体集）+ 同一浏览器 build，消除跨环境渲染差异。
    # 2026-11-10 前用系统 Chrome，CI runner 版本与本机不同导致 5 次视觉基线失败（§30.8）。
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 增量判定要 diff 到 push 前的提交，默认浅克隆（depth 1）拿不到基线 sha。
          # 仓库 .git 仅 17 MB，全历史克隆的成本远低于「拿不到基线就只能全量跑」。
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # channel:'chromium' 用完整 build 的 new headless，--no-shell 跳过用不到的
      # 99 MiB headless-shell（本机代理下已证实卡住，CI 不必承担同一失败面）。
      - run: pnpm exec playwright install chromium --no-shell
      - run: pnpm exec tsc --version
      # §30.34 双层门禁（严格互补，不存在两个门都不跑的事件）：
      #   dev push → 增量；push main（发版合并）/ tag / 手动 / 夜间 → 全量。
      # 判定逻辑在 scripts/affected.mjs，原则「默认全量、白名单才收缩」。
      - name: 推断增量 e2e 作用域
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: node scripts/affected.mjs --base "${{ github.event.before }}" --github-env
      - name: Incremental gate (pnpm verify:main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: pnpm verify:main
      - name: Full gate (pnpm verify)
        if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
        run: pnpm verify
      # 视觉基线若仍出现跨环境差异，上传 actual / diff 截图供像素级定位，不必只靠日志猜。
      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ github.run_id }}
          path: |
            test-results/e2e
            playwright-report
          retention-days: 7

  # 三架构平台包校验（S-09）：TS 7 的平台二进制按 os/cpu 分发，跨架构必须真跑过。
  # 只在手动派发时执行 —— push 已有 verify 在 macOS 上覆盖本架构，另两架构按需验。
  platform-packages:
    name: 'TS 7 platform packages (${{ matrix.os }})'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --version
      - run: pnpm check:platforms
